apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aks-service-proxy
  namespace: kars-kars-sbx-coding
spec:
  podSelector:
    matchLabels:
      kars.azure.com/component: sandbox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: konnectivity-agent
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
